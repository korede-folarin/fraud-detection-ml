# build from the repository root:
#   bentoml build -f bento_service/bentofile.yaml .
service: "bento_service.service:FraudDetectionService"

labels:
  project: fraud-detection-ml
  stage: champion

include:
  - "bento_service/__init__.py"
  - "bento_service/service.py"
  - "src/frauddetection/__init__.py"
  - "src/frauddetection/inference.py"

python:
  packages:
    - pandas
    - scikit-learn
    - xgboost
    - pydantic

docker:
  python_version: "3.11"
